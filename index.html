<script>
    

function checkauth(){
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    fetch("/login", {
        method: "POST",
        headers: {
    "Content-Type": "application/json"},
        body: JSON.stringify({ email: email, password: password })
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === "success") {
            alert("Login success");
            document.getElementById("sec2").style.display = "block";
        } else {
            alert("Invalid credentials");
        }
    });
}
function getweather() {
    var city = document.getElementById("winput").value;
    var apiKey = "82252ca6a8339af2f43f79f1598d2193";

    const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${apiKey}`;

    fetch(url)
        .then(res => res.json())
        .then(data => {
            if (data.cod === 200) {
                document.getElementById("weather-right").innerHTML =
                `🌍 City: ${data.name}<br>
                 🌡️ Temp: ${data.main.temp} °C<br>
                 ☁️ Weather: ${data.weather[0].description}`;
            } else {
                document.getElementById("weather-right").innerHTML =
                "❌ City not found";
            }
        })
        .catch(err => {
            console.log(err);
        });
}

// --- NEW FUNCTION FOR GEMINI CHAT ---
function sendChat() {
    let inputField = document.getElementById("inputchat");
    let message = inputField.value;
    
    if (message.trim() === "") return;

    // Show user message instantly
    let clientDiv = document.getElementById("client");
    clientDiv.innerHTML += `<p class="user-msg"><b>You:</b> ${message}</p>`;
    
    // Clear input
    inputField.value = "";

    // Send to Flask Backend
    fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: message })
    })
    .then(res => res.json())
    .then(data => {
        // Show AI response
        let aiDiv = document.getElementById("ai");
        // Using innerHTML allows simple formatting if Gemini sends bolding
        aiDiv.innerHTML += `<p class="ai-msg"><b>Gemini:</b> ${data.reply}</p>`; 
    })
    .catch(error => {
        console.error("Error:", error);
    });
}
</script>
