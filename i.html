<script>
function getweather() {
    let city = document.getElementById("winput").value.trim();

    if (city === "") {
        document.getElementById("weather-right").innerHTML =
        "⚠️ Please enter a city name";
        return;
    }

    let apiKey = "82252ca6a8339af2f43f79f1598d2193"; // put your real key here

    let url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${apiKey}`;

    fetch(url)
        .then(response => response.json())
        .then(data => {
            if (data.cod === 200) {
                document.getElementById("weather-right").innerHTML = `
                    🌍 City: ${data.name}<br>
                    🌡️ Temperature: ${data.main.temp} °C<br>
                    ☁️ Weather: ${data.weather[0].description}
                `;
            } else {
                document.getElementById("weather-right").innerHTML =
                "❌ City not found";
            }
        })
        .catch(error => {
            document.getElementById("weather-right").innerHTML =
            "⚠️ Error fetching data";
            console.error(error);
        });
}
</script>
